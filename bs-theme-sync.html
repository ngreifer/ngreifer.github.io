<script>
(function () {
  // Inject Bootstrap's own CSS from CDN so [data-bs-theme="dark"] rules
  // are available — Quarto's compiled CSS doesn't include them
  var link = document.createElement('link');
  link.rel  = 'stylesheet';
  link.href = 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.css';
  link.id   = 'bs-cdn-css';
  document.head.appendChild(link);

  function isDark() {
    return window.localStorage.getItem('quarto-color-scheme') === 'alternate';
  }

  function applyTheme() {
    document.documentElement.setAttribute(
      'data-bs-theme',
      isDark() ? 'dark' : 'light'
    );
  }

  applyTheme();

  document.addEventListener('readystatechange', function () {
    if (document.readyState === 'complete') {
      var original = window.quartoToggleColorScheme;
      if (typeof original === 'function') {
        window.quartoToggleColorScheme = function () {
          original();
          applyTheme();
        };
      }
    }
  });
})();
</script>
